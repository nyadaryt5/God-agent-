[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "god-agent"
version = "0.2.0"
description = "God-Agent (goda) — a self-aware, self-evolving AI system administrator for Linux servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "God-Agent Contributors" }]
keywords = ["agent", "ai", "sysadmin", "linux", "self-evolving", "automation"]
dependencies = []

[project.optional-dependencies]
# Real agent engines. God-Agent falls back to the built-in offline heuristic
# planner when none of these are installed. Install one or more; each becomes
# selectable via `goda settings agent.engine <name>`.
# Note: crewai, langgraph, and hermes-agent each pin their own `openai`/`pydantic`
# versions, so mixing several of them in one venv may raise pip conflict warnings;
# the individual engines still import and run (see README). For a conflict-free
# GUI stack, install `ui-tars` + `gui` together. Grok Build is a CLI (no pip
# extra): `curl -fsSL https://x.ai/cli/install.sh | bash` — God detects the `grok`
# binary and drives it headlessly; xAI's API is also a selectable provider.
agents = ["openai-agents>=0.10"]
# Real browser automation: headless Chromium with JS, cookies, and sessions.
# After installing, fetch the browser binary once: `playwright install chromium`
browser = ["playwright>=1.40"]
crewai = ["crewai>=0.100"]
langgraph = ["langgraph>=0.2"]
hermes = ["hermes-agent>=0.18"]
ui-tars = ["ui-tars>=0.4.8"]
# UI-TARS can actually act on the desktop (screenshot + pyautogui). headless-only
# use needs just `ui-tars` (+ a vision OpenAI-compatible endpoint).
gui = ["pyautogui", "pillow"]
all-engines = ["openai-agents>=0.10", "crewai>=0.100", "langgraph>=0.2",
               "hermes-agent>=0.18", "ui-tars>=0.4.8"]
dev = ["pytest>=7"]

[project.scripts]
goda = "god_agent.cli:main"
god-agent = "god_agent.cli:main"

[project.gui-scripts]
god-agent-desktop = "god_agent.desktop:main"

[tool.setuptools.packages.find]
include = ["god_agent*"]

[tool.setuptools.package-data]
god_agent = ["static/*"]
